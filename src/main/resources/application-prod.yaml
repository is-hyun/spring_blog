server:
  port: 5000

logging:
  level:
    root: INFO
    com.tenco.spring_blog: INFO

spring:
  # 데이터 베이스 연결 (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA 설정
  jpa:
    hibernate:
      default_batch_fetch_size: 10
      # 운영 환경에서는 create 대신 update 사용. 없는 테이블과 컬럼만 추가
      ddl-auto: update
    # 실행되는 SQL을 콘솔에 출력
    show-sql: true
    # 테이블 data.sql을 실행
    defer-datasource-initialization: true
