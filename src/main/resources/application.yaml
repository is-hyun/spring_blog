spring:
  config:
    import: optional:file:.env[.properties]
  mustache:
    servlet:
      expose-session-attributes: false
  servlet:
    multipart:
      max-file-size: 10MB       # 파일 최대 크기
      max-request-size: 11MB    # 요청 전체(파일 + 입력값)의 최대 크기
  profiles:
    active: local

server:
  servlet:
    session:
      tracking-modes: cookie